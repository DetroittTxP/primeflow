# TLS edge for the site simulation, and a reference for whatever terminates 443
# in front of a real PrimeFlow server. Two things matter, and both fail silently:
#
#   1. PrimeFlow has two server-sent-event endpoints, and buffering breaks each
#      of them without reporting anything. /api/v1/worker/stream is the worker
#      wake-up channel: held bytes drop a site to its 15s poll instead of ~200ms
#      dispatch. /api/v1/stream is the console's live event feed: held bytes
#      leave the dashboard frozen while every other page loads normally.
#   2. proxy_pass to a fixed name is resolved once at start-up. Behind Docker
#      (or any DNS-based service discovery) the server's address changes on a
#      restart, so resolve through a variable with a short TTL.

# Docker's embedded DNS. Replace with your resolver outside Docker.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 443 ssl;
    server_name edge;

    ssl_certificate     /certs/edge.crt;
    ssl_certificate_key /certs/edge.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    set $upstream http://server:8080;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # Both SSE endpoints: the worker wake-up channel and the console's event
    # feed. proxy_pass carries no URI part, so the original request URI is
    # forwarded as-is here exactly as it is from a prefix location.
    location ~ ^/api/v1/(worker/)?stream$ {
        proxy_pass $upstream;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass $upstream;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    location = /edge-healthz { return 200 "ok\n"; }
    location / { return 301 https://$host$request_uri; }
}
