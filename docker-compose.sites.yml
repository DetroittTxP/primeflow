# Remote-site simulation: three "site VMs" whose only route to PrimeFlow is the
# server's API. Runs beside docker-compose.yml as its own project, so the main
# stack's commands are unchanged.
#
#   ./sites/issue-keys.sh                                      # pools + keys -> sites/site-*.env
#   docker compose -f docker-compose.sites.yml up -d --build   # plain http, straight to server:8080
#   docker compose -f docker-compose.sites.yml logs -f site-a
#
# TLS mode puts an nginx edge on 443 in front of the server, which is the one
# thing worth checking before a real rollout: certificate trust, and a proxy
# that passes the SSE wake-up stream through unbuffered.
#
#   docker compose --env-file sites/tls.env -f docker-compose.sites.yml up -d --build
#   docker compose --env-file sites/tls.env -f docker-compose.sites.yml down    # back to plain: then up -d
#
# sites/tls.env sets COMPOSE_PROFILES=tls and SITE_API_URL=https://edge; nothing else changes.
#
# Topology
#   site-a … site-d           primex-worker in remote mode: an API URL, a pool-scoped key,
#                              no DSN, no bus. Attached to `site-link` only.
#   site-link                  the network docker-compose.yml puts the server on for exactly
#                              this purpose. postgres, nats and redis are not on it.
#   edge      [profile tls]    nginx terminating TLS on 443 and proxying to server:8080;
#                              sites/nginx.conf doubles as the reference proxy config.
#   certs     [profile tls]    one-shot self-signed certificate for `edge`; the workers trust
#                              it through SSL_CERT_FILE, the way a site trusts an org CA.
#
# Crash test (what systemd Restart= does for a real site VM)
#   docker kill -s KILL primeflow-sites-site-a-1                # Docker treats kill as a
#   docker compose -f docker-compose.sites.yml start site-a     # manual stop: no auto-restart
#   The run's lease expires after PRIMEFLOW_LEASE (60s), the server reschedules it, and
#   the restarted worker replays it: tasks with a checkpoint return their stored result.

name: primeflow-sites

x-site-worker: &site-worker
  build: .
  image: primeflow-sites-worker
  entrypoint: ["/usr/local/bin/primex-worker"]
  environment:
    PRIMEFLOW_API_URL: ${SITE_API_URL:-http://server:8080}
    # Read only for an https:// URL; harmless while the volume is empty.
    SSL_CERT_FILE: /certs/edge.crt
  volumes:
    - edge-certs:/certs:ro
  networks: [site-link]
  depends_on:
    # Both exist only under the tls profile, hence optional.
    certs: {condition: service_completed_successfully, required: false}
    edge: {condition: service_healthy, required: false}
  restart: unless-stopped

services:
  certs:
    profiles: [tls]
    image: alpine/openssl
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        cd /certs
        if [ ! -s edge.crt ]; then
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes \
            -days 3650 -subj "/CN=edge" -addext "subjectAltName=DNS:edge" \
            -keyout edge.key -out edge.crt
        fi
        chmod 644 edge.crt
        chmod 600 edge.key
        echo "edge certificate ready"
    volumes:
      - edge-certs:/certs

  edge:
    profiles: [tls]
    image: nginx:alpine
    volumes:
      - ./sites/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - edge-certs:/certs:ro
    networks: [site-link]
    depends_on:
      certs: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/edge-healthz"]
      interval: 3s
      timeout: 2s
      retries: 10

  site-a:
    <<: *site-worker
    env_file: [./sites/site-a.env]

  site-b:
    <<: *site-worker
    env_file: [./sites/site-b.env]

  site-c:
    <<: *site-worker
    env_file: [./sites/site-c.env]

  site-d:
    <<: *site-worker
    env_file: [./sites/site-d.env]

networks:
  site-link:
    external: true
    name: primeflow_site-link

volumes:
  edge-certs:
