<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password · PrimeFlow</title>
<link rel="icon" type="image/png" href="/primeflow.png">
<link rel="stylesheet" href="/css/reset.css">
</head>
<body>
<form class="card" id="f">
  <div class="brand">Prime<span>Flow</span></div>
  <div class="sub">Choose a new password.</div>
  <label for="pw">New password</label>
  <input id="pw" type="password" autocomplete="new-password" minlength="8" required autofocus>
  <label for="pw2">Confirm</label>
  <input id="pw2" type="password" autocomplete="new-password" minlength="8" required>
  <button id="go" type="submit">Set password</button>
  <div class="msg" id="msg"></div>
</form>
<script type="module" src="/js/reset.js"></script>
</body>
</html>
