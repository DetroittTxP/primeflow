<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · PrimeFlow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6feb'/%3E%3Cpath d='M9 8h14M9 16h10M9 24h6' stroke='white' stroke-width='3.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #16181d; --muted: #6b7280;
    --line: #e3e6ea; --accent: #2f6feb; --err: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #171a21; --ink: #e6e8ec; --muted: #9aa3b2;
      --line: #262b35; --accent: #6ea1ff; --err: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 28px 26px; width: min(360px, 92vw); box-shadow: 0 8px 30px rgba(0,0,0,.10);
  }
  .brand { font-weight: 650; font-size: 17px; letter-spacing: -0.01em; margin-bottom: 2px; }
  .brand span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 20px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  input {
    width: 100%; font: inherit; padding: 8px 10px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
  button {
    width: 100%; margin-top: 20px; font: inherit; font-weight: 600; cursor: pointer;
    padding: 9px 12px; border-radius: 7px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff;
  }
  button:disabled { opacity: .6; cursor: default; }
  button.sso {
    background: var(--panel); color: var(--ink); border-color: var(--line);
    margin-top: 10px;
  }
  .or { text-align: center; color: var(--muted); font-size: 11.5px; margin: 14px 0 0; }
  .err { color: var(--err); font-size: 12.5px; margin-top: 14px; min-height: 1.2em; }
</style>
</head>
<body>
<form class="card" id="f">
  <div class="brand">Prime<span>Flow</span></div>
  <div class="sub">Sign in to the operator console.</div>
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="username" required autofocus>
  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password" required>
  <button id="go" type="submit">Sign in</button>
  <div id="sso-wrap" hidden>
    <div class="or">or</div>
    <button type="button" class="sso" id="sso"></button>
  </div>
  <div class="err" id="err"></div>
</form>
<script>
  const f = document.getElementById('f');
  const err = document.getElementById('err');
  const go = document.getElementById('go');
  const next = new URLSearchParams(location.search).get('next') || '/';

  if (new URLSearchParams(location.search).get('sso_error')) {
    err.textContent = 'Single sign-on failed (' + new URLSearchParams(location.search).get('sso_error') + '). Try again or use a password.';
  }
  fetch('/api/v1/auth/config', { credentials: 'same-origin' }).then(r => r.json()).then(cfg => {
    if (cfg && cfg.oidc) {
      document.getElementById('sso').textContent = 'Sign in with ' + (cfg.oidc_label || 'SSO');
      document.getElementById('sso').onclick = () => { location.href = '/api/v1/auth/oidc/login'; };
      document.getElementById('sso-wrap').hidden = false;
    }
  }).catch(() => {});
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    go.disabled = true;
    try {
      const r = await fetch('/api/v1/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
        }),
      });
      const body = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(body.error || r.statusText);
      location.href = next.startsWith('/') ? next : '/';
    } catch (ex) {
      err.textContent = ex.message;
      go.disabled = false;
    }
  });
</script>
</body>
</html>
