<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · PrimeFlow</title>
<link rel="icon" type="image/png" href="/primeflow.png">
<link rel="stylesheet" href="/css/login.css">
</head>
<body>
<form class="card" id="f">
  <div class="brand" aria-label="PrimeFlow">
    <img class="brand-logo" src="/primeflow.png" alt="PrimeFlow logo" />
    <div class="brand-name">Prime<span class="accent">Flow</span></div>
  </div>
  <div class="sub">Sign in to the operator console.</div>
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="username" required autofocus>
  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password" required>
  <button id="go" type="submit">Sign in</button>
  <div id="sso-wrap" hidden>
    <div class="or">or</div>
    <button type="button" class="sso" id="sso"></button>
  </div>
  <div class="err" id="err"></div>
</form>
<script type="module" src="/js/login.js"></script>
</body>
</html>
