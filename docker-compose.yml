# Local development stack: Postgres, Redis, the PrimeFlow server, and one
# example worker. `docker compose up --build` then open http://localhost:8080.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: primeflow
      POSTGRES_PASSWORD: primeflow
      POSTGRES_DB: primeflow
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U primeflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # Persistence is off on purpose: the bus carries hints, not state.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: .
    command: ["server"]
    environment:
      PRIMEFLOW_DATABASE_URL: postgres://primeflow:primeflow@postgres:5432/primeflow?sslmode=disable
      PRIMEFLOW_REDIS_URL: redis://redis:6379
      PRIMEFLOW_HTTP_ADDR: ":8080"
      # Seeds the first operator account on an empty database. Change these.
      PRIMEFLOW_ADMIN_EMAIL: admin@primeflow.local
      PRIMEFLOW_ADMIN_PASSWORD: primeflow-admin
      # PRIMEFLOW_API_TOKEN: change-me            # bearer token for workers / CLI
      # PRIMEFLOW_TRUSTED_PROXY_CIDRS: 10.0.0.0/8 # trust XFF / client-cert headers from here
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build: .
    entrypoint: ["/usr/local/bin/primex-worker"]
    environment:
      PRIMEFLOW_DATABASE_URL: postgres://primeflow:primeflow@postgres:5432/primeflow?sslmode=disable
      PRIMEFLOW_REDIS_URL: redis://redis:6379
      PRIMEFLOW_QUEUES: default,vcd,metering
      PRIMEFLOW_CONCURRENCY: "4"
      PRIMEFLOW_WORKER_NAME: primex-worker
    depends_on:
      server: {condition: service_started}
    deploy:
      replicas: 2

volumes:
  pgdata:
