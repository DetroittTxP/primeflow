# Local development stack: Postgres, NATS, the PrimeFlow server, and two example
# workers. `docker compose up --build`, then open http://localhost:8080.
#
# The notification bus here is NATS. Redis is left in as a drop-in alternative:
# comment PRIMEFLOW_NATS_URL out and uncomment PRIMEFLOW_REDIS_URL on the server
# and worker to switch. With neither set the process uses its in-process bus and
# falls back to polling — still fully correct, just higher latency.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: primeflow
      POSTGRES_PASSWORD: primeflow
      POSTGRES_DB: primeflow
    ports: ["${PRIMEFLOW_PG_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U primeflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2-alpine
    command: ["-m", "8222"]           # monitoring endpoint on :8222
    ports: ["${PRIMEFLOW_NATS_PORT:-4222}:4222", "${PRIMEFLOW_NATS_MON_PORT:-8222}:8222"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # Persistence is off on purpose: the bus carries hints, not state.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["${PRIMEFLOW_REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Uncomment to collect traces. Then set OTEL_EXPORTER_OTLP_ENDPOINT on the
  # server and worker to http://otel-collector:4318 and traces start flowing.
  # otel-collector:
  #   image: otel/opentelemetry-collector:latest
  #   command: ["--config=/etc/otelcol/config.yaml"]
  #   ports: ["4318:4318"]

  server:
    build: .
    command: ["server"]
    environment:
      PRIMEFLOW_DATABASE_URL: postgres://primeflow:primeflow@postgres:5432/primeflow?sslmode=disable
      PRIMEFLOW_NATS_URL: nats://nats:4222
      # Set the Redis URL to make the login throttle + API-key rate limiter
      # cluster-wide (works alongside NATS as the bus).
      PRIMEFLOW_REDIS_URL: redis://redis:6379
      PRIMEFLOW_HTTP_ADDR: ":8080"
      # Seeds the first operator account on an empty database. Change these.
      PRIMEFLOW_ADMIN_EMAIL: admin@primeflow.local
      PRIMEFLOW_ADMIN_PASSWORD: primeflow-admin
      PRIMEFLOW_LOG_RETENTION: "720h"
      # GitOps worker delivery: how often the reconciler pushes drifted
      # auto-sync worker specs. Set the target repo in the console under
      # Settings → Git connection (a file:/// path works for a local trial).
      PRIMEFLOW_GITSYNC_INTERVAL: "2m"
      # PRIMEFLOW_API_TOKEN: change-me
      # PRIMEFLOW_TRUSTED_PROXY_CIDRS: 10.0.0.0/8
      # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # --- OIDC SSO (point at your IdP) ---
      # PRIMEFLOW_OIDC_ISSUER: https://accounts.google.com
      # PRIMEFLOW_OIDC_CLIENT_ID: xxx.apps.googleusercontent.com
      # PRIMEFLOW_OIDC_CLIENT_SECRET: xxx
      # PRIMEFLOW_OIDC_ROLE_CLAIM: groups
      # PRIMEFLOW_OIDC_ROLE_MAP: platform-admins=admin,ops=operator
    ports: ["${PRIMEFLOW_HTTP_PORT:-8080}:8080"]
    # site-link is where docker-compose.sites.yml reaches the server: only the
    # server joins it, so a simulated site has no route to Postgres, NATS or Redis.
    networks: [default, site-link]
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_healthy}

  # A push-pool receiver: set a work pool's pool_type=push and push_endpoint to
  # http://push-worker:8090/run, and the server dispatches ready runs here.
  push-worker:
    build: .
    entrypoint: ["/usr/local/bin/primex-worker", "-push"]
    environment:
      PRIMEFLOW_DATABASE_URL: postgres://primeflow:primeflow@postgres:5432/primeflow?sslmode=disable
      PRIMEFLOW_NATS_URL: nats://nats:4222
      PRIMEFLOW_PUSH_ADDR: ":8090"
      PRIMEFLOW_PUSH_SECRET: compose-push-secret
      PRIMEFLOW_WORKER_NAME: primex-push
    depends_on:
      server: {condition: service_started}

  worker:
    build: .
    entrypoint: ["/usr/local/bin/primex-worker"]
    environment:
      PRIMEFLOW_DATABASE_URL: postgres://primeflow:primeflow@postgres:5432/primeflow?sslmode=disable
      PRIMEFLOW_NATS_URL: nats://nats:4222
      # PRIMEFLOW_REDIS_URL: redis://redis:6379
      PRIMEFLOW_QUEUES: default,vcd,metering
      PRIMEFLOW_CONCURRENCY: "4"
      PRIMEFLOW_WORKER_NAME: primex-worker
      # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      server: {condition: service_started}
    deploy:
      replicas: 2

volumes:
  pgdata:

networks:
  site-link:
