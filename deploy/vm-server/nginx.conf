# TLS edge for the PrimeFlow control plane.
#
# Two things here are not decoration, and both fail silently if dropped:
#
#   proxy_buffering off on the SSE endpoints. /api/v1/worker/stream is the
#   worker wake-up channel — buffered, sub-second dispatch becomes the poll
#   interval. /api/v1/stream is the console's live feed — buffered, the
#   dashboard freezes while every other page loads normally.
#
#   resolver + a variable in proxy_pass. nginx resolves a name in proxy_pass
#   once, at start-up. Without this, restarting the server container leaves
#   nginx talking to an address nothing is listening on until nginx restarts too.

server {
    listen 80;
    server_name _;
    # The console sets Secure cookies; there is no useful plaintext mode.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Docker's embedded DNS. Outside Docker, point this at your own resolver.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream http://server:8080;

    # An artifact or a large parameter payload should not hit a 1 MB wall.
    client_max_body_size 32m;

    # Both server-sent-event endpoints.
    location ~ ^/api/v1/(worker/)?stream$ {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        # A wake-up stream is meant to stay open; the server sends comment
        # pings every 20s, so anything comfortably above that is fine.
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
